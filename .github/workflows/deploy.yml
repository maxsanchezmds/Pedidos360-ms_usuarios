name: Deploy users service

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-users-service-main
  cancel-in-progress: false

env:
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}

jobs:
  deploy:
    name: Validate, package and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.15.0
          cache: npm

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AWS_ACCOUNT_ID}" || { echo "::error::Missing repository variable AWS_ACCOUNT_ID"; exit 1; }
          test -n "${AWS_REGION}" || { echo "::error::Missing repository variable AWS_REGION"; exit 1; }
          test -n "${LAMBDA_FUNCTION_NAME}" || { echo "::error::Missing repository variable LAMBDA_FUNCTION_NAME"; exit 1; }
          test -n "${{ vars.AWS_ROLE_ARN }}" || { echo "::error::Missing repository variable AWS_ROLE_ARN"; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: |
          npm run typecheck
          npm test
          npm run lint
          npm audit --omit=dev --audit-level=high

      - name: Build NestJS application
        run: npm run build

      - name: Create Lambda deployment package
        shell: bash
        run: |
          set -euo pipefail
          mkdir lambda-package
          cp -R dist lambda-package/dist
          cp package.json package-lock.json lambda-package/
          cd lambda-package
          npm ci --omit=dev --ignore-scripts
          zip -q -r ../users-service.zip .
          cd ..

          ZIP_BYTES=$(stat -c%s users-service.zip)
          MAX_DIRECT_UPLOAD_BYTES=$((50 * 1024 * 1024))
          echo "Deployment package size: ${ZIP_BYTES} bytes"
          if [ "${ZIP_BYTES}" -gt "${MAX_DIRECT_UPLOAD_BYTES}" ]; then
            echo "::error::The ZIP exceeds Lambda's 50 MB direct-upload limit"
            exit 1
          fi

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          unset-current-credentials: true

      - name: Verify target Lambda exists
        run: |
          aws lambda get-function \
            --function-name "${LAMBDA_FUNCTION_NAME}" \
            --query 'Configuration.[FunctionName,Runtime,Handler]' \
            --output table

      - name: Deploy Lambda code
        run: |
          aws lambda update-function-code \
            --function-name "${LAMBDA_FUNCTION_NAME}" \
            --zip-file fileb://users-service.zip \
            --no-cli-pager \
            --query '[FunctionName,LastModified,CodeSize]' \
            --output table

          aws lambda wait function-updated \
            --function-name "${LAMBDA_FUNCTION_NAME}"

      - name: Verify deployment status
        run: |
          STATUS=$(aws lambda get-function-configuration \
            --function-name "${LAMBDA_FUNCTION_NAME}" \
            --query 'LastUpdateStatus' \
            --output text)
          test "${STATUS}" = "Successful" || { echo "::error::Lambda update status is ${STATUS}"; exit 1; }
          echo "Lambda deployment completed successfully."

